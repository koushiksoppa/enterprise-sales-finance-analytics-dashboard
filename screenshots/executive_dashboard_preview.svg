<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="56" fill="#0B3C5D"/>
  <text x="24" y="35" fill="#FFFFFF" font-size="20" font-weight="600">Executive Dashboard</text>
  <text x="900" y="35" fill="#D9B44A" font-size="13">Year: 2024   Region: All   Segment: All</text>

  <!-- KPI cards -->
  <g font-size="12" fill="#5F5E5A">
    <rect x="24" y="76" width="216" height="88" rx="8" fill="#F1EFE8"/>
    <text x="40" y="100">TOTAL REVENUE</text>
    <text x="40" y="140" font-size="26" font-weight="700" fill="#0B3C5D">$46.9M</text>

    <rect x="256" y="76" width="216" height="88" rx="8" fill="#F1EFE8"/>
    <text x="272" y="100">TOTAL PROFIT</text>
    <text x="272" y="140" font-size="26" font-weight="700" fill="#1D8A99">$22.7M</text>

    <rect x="488" y="76" width="216" height="88" rx="8" fill="#F1EFE8"/>
    <text x="504" y="100">PROFIT MARGIN</text>
    <text x="504" y="140" font-size="26" font-weight="700" fill="#D9B44A">48.4%</text>

    <rect x="720" y="76" width="216" height="88" rx="8" fill="#F1EFE8"/>
    <text x="736" y="100">TOTAL ORDERS</text>
    <text x="736" y="140" font-size="26" font-weight="700" fill="#0B3C5D">19,665</text>

    <rect x="952" y="76" width="216" height="88" rx="8" fill="#F1EFE8"/>
    <text x="968" y="100">CUSTOMERS</text>
    <text x="968" y="140" font-size="26" font-weight="700" fill="#0B3C5D">500</text>
  </g>

  <!-- revenue trend chart -->
  <rect x="24" y="188" width="560" height="230" rx="8" fill="#FFFFFF" stroke="#E6E6E6"/>
  <text x="40" y="210" font-size="13" font-weight="600" fill="#0B3C5D">Revenue vs Profit by Month</text>
  <polyline points="50,380 100,360 150,340 200,355 250,320 300,300 350,310 400,270 450,260 500,240 550,230"
            fill="none" stroke="#0B3C5D" stroke-width="2.5"/>
  <polyline points="50,400 100,395 150,385 200,390 250,375 300,365 350,370 400,350 450,345 500,335 550,325"
            fill="none" stroke="#1D8A99" stroke-width="2.5"/>

  <!-- region map placeholder -->
  <rect x="600" y="188" width="280" height="230" rx="8" fill="#FFFFFF" stroke="#E6E6E6"/>
  <text x="616" y="210" font-size="13" font-weight="600" fill="#0B3C5D">Revenue by Region</text>
  <circle cx="700" cy="300" r="60" fill="#328CC1" opacity="0.85"/>
  <circle cx="760" cy="330" r="35" fill="#73A9AD" opacity="0.85"/>

  <!-- top products bar chart -->
  <rect x="896" y="188" width="272" height="230" rx="8" fill="#FFFFFF" stroke="#E6E6E6"/>
  <text x="912" y="210" font-size="13" font-weight="600" fill="#0B3C5D">Top 5 Products</text>
  <g fill="#0B3C5D">
    <rect x="912" y="230" width="220" height="14" rx="3"/>
    <rect x="912" y="252" width="190" height="14" rx="3" fill="#328CC1"/>
    <rect x="912" y="274" width="160" height="14" rx="3" fill="#73A9AD"/>
    <rect x="912" y="296" width="130" height="14" rx="3" fill="#D9B44A"/>
    <rect x="912" y="318" width="100" height="14" rx="3" fill="#E37B40"/>
  </g>

  <!-- nav bar -->
  <g font-size="12" fill="#5F5E5A">
    <text x="24" y="450" font-weight="600" fill="#0B3C5D">Navigate:</text>
    <rect x="100" y="432" width="150" height="26" rx="4" fill="#0B3C5D"/>
    <text x="112" y="449" fill="#FFFFFF">Executive Dashboard</text>
    <rect x="260" y="432" width="120" height="26" rx="4" fill="#F1EFE8"/>
    <text x="272" y="449">Sales Analytics</text>
    <rect x="390" y="432" width="130" height="26" rx="4" fill="#F1EFE8"/>
    <text x="402" y="449">Financial Analytics</text>
    <rect x="530" y="432" width="130" height="26" rx="4" fill="#F1EFE8"/>
    <text x="542" y="449">Customer Analytics</text>
    <rect x="670" y="432" width="130" height="26" rx="4" fill="#F1EFE8"/>
    <text x="682" y="449">Inventory Analytics</text>
    <rect x="810" y="432" width="140" height="26" rx="4" fill="#F1EFE8"/>
    <text x="822" y="449">Forecast Dashboard</text>
  </g>

  <text x="24" y="660" font-size="11" fill="#B0B0B0">Illustrative mockup — replace with an actual Power BI Desktop screenshot after following powerbi/POWERBI_BUILD_GUIDE.md</text>
</svg>
