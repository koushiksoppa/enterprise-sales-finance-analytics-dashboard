<rect x="742.0" y="552.0" width="2.5" height="30.0" fill="#6B7A8D"/>
<text x="754.0" y="562.0" font-size="11" fill="#1B3A5C" font-weight="600">Method</text>
<text x="754.0" y="576.0" font-size="10.5" fill="#2E3A4B" font-weight="400">Least-squares trend on monthly revenue, scaled by a month-of-year seasonal index derived</text>
<text x="754.0" y="589.0" font-size="10.5" fill="#2E3A4B" font-weight="400">from the same history.</text>
<rect x="742.0" y="608.0" width="2.5" height="30.0" fill="#6B7A8D"/>
<text x="754.0" y="618.0" font-size="11" fill="#1B3A5C" font-weight="600">Range</text>
<text x="754.0" y="632.0" font-size="10.5" fill="#2E3A4B" font-weight="400">Plus or minus 1.96 residual standard deviations of the in-sample fit - historical</text>
<text x="754.0" y="645.0" font-size="10.5" fill="#2E3A4B" font-weight="400">dispersion, not a confidence guarantee.</text>
<rect x="742.0" y="664.0" width="2.5" height="30.0" fill="#6B7A8D"/>
<text x="754.0" y="674.0" font-size="11" fill="#1B3A5C" font-weight="600">Assumption</text>
<text x="754.0" y="688.0" font-size="10.5" fill="#2E3A4B" font-weight="400">Pricing, product mix and market conditions hold. Treat as a planning input, not a</text>
<text x="754.0" y="701.0" font-size="10.5" fill="#2E3A4B" font-weight="400">commitment.</text>
